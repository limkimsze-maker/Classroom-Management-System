<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Smart Math Whiteboard Beta • Classroom Companion</title>
<style>
:root{--teal:#0f766e;--teal2:#e7f7f4;--navy:#17324d;--muted:#667085;--line:#d8e1e8;--red:#b42318}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef4f5;color:var(--navy)}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{height:100%;display:flex;flex-direction:column;padding:10px;gap:9px}.top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:17px;padding:8px 10px;box-shadow:0 8px 22px rgba(18,32,46,.08);flex:none}.brand{display:flex;align-items:center;gap:8px;margin-right:auto}.icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--teal2);font-size:22px}.meta strong{display:block;font-size:16px;font-weight:1000;letter-spacing:-.02em}.meta span{display:block;font-size:10px;color:var(--muted);font-weight:800;margin-top:1px}.tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.btn{min-height:38px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--navy);padding:7px 10px;font-size:12px;font-weight:950}.btn:hover,.btn:focus-visible{border-color:#73c8bc;outline:none}.btn.active{background:var(--teal);border-color:var(--teal);color:#fff}.btn.soft{background:var(--teal2);border-color:#9dd9d0;color:#0a5d57}.btn.danger{background:#fff3f1;border-color:#efb4ad;color:var(--red)}.btn:disabled{opacity:.42;cursor:not-allowed}.colors{display:flex;align-items:center;gap:5px;padding:3px 5px;border:1px solid #e3e9ed;border-radius:12px;background:#f8fafb}.colour{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #ccd5db;cursor:pointer;padding:0}.colour.active{box-shadow:0 0 0 3px #0f766e}.sizeControl{display:flex;align-items:center;gap:6px;padding:0 4px}.sizeControl span{font-size:10px;font-weight:900;color:var(--muted)}.sizeControl input{width:82px;accent-color:var(--teal)}.sizeValue{min-width:26px;text-align:center;font-size:10px;font-weight:950;color:var(--navy)}.boardWrap{position:relative;flex:1;min-height:0;border:1px solid #cfd9de;border-radius:18px;overflow:hidden;background-color:#fff;box-shadow:0 10px 28px rgba(18,32,46,.08)}.boardWrap.grid{background-image:linear-gradient(#e8eef1 1px,transparent 1px),linear-gradient(90deg,#e8eef1 1px,transparent 1px);background-size:32px 32px}.boardWrap::after{content:attr(data-watermark);position:absolute;right:12px;bottom:9px;font-size:10px;font-weight:900;color:#a7b3ba;pointer-events:none;user-select:none}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}.mode{position:absolute;left:10px;bottom:9px;padding:5px 8px;border-radius:999px;background:rgba(23,50,77,.82);color:#fff;font-size:10px;font-weight:900;pointer-events:none;backdrop-filter:blur(4px)}.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%) translateY(8px);background:#17324d;color:#fff;padding:8px 13px;border-radius:999px;font-size:11px;font-weight:900;opacity:0;pointer-events:none;transition:.18s;z-index:100}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:800px){.shell{padding:6px;gap:6px}.top{border-radius:14px;padding:7px}.meta span{display:none}.tools{width:100%}.brand{width:100%;margin-right:0}.btn{min-height:36px;padding:6px 8px}.boardWrap{border-radius:14px}.sizeControl{margin-left:auto}.colors{order:10}.colour{width:27px;height:27px}}
</style>
<script src="https://cdn.counter.dev/script.js" data-id="825e93b6-ce99-40ef-8bcc-125f13297433" data-utcoffset="8"></script>
</head>
<body>
<div class="shell">
<header class="top">
<div class="brand"><div class="icon">✨</div><div class="meta"><strong id="boardTitle">Smart Math Whiteboard Beta</strong><span id="boardSubtitle">Protected beta — production Whiteboard is unchanged.</span></div></div>
<div class="tools" role="toolbar" aria-label="Whiteboard tools">
<button class="btn active" id="penBtn" type="button">✏️ Pen</button>
<button class="btn" id="textBtn" type="button">T Text</button>
<button class="btn" id="eraserBtn" type="button">⌫ Eraser</button>
<div class="colors" aria-label="Pen colour">
<button class="colour active" type="button" data-colour="#17324d" style="background:#17324d" aria-label="Navy"></button>
<button class="colour" type="button" data-colour="#2563eb" style="background:#2563eb" aria-label="Blue"></button>
<button class="colour" type="button" data-colour="#dc2626" style="background:#dc2626" aria-label="Red"></button>
<button class="colour" type="button" data-colour="#15803d" style="background:#15803d" aria-label="Green"></button>
<button class="colour" type="button" data-colour="#7c3aed" style="background:#7c3aed" aria-label="Purple"></button>
</div>
<label class="sizeControl"><span id="sizeLabel">Thickness</span><input id="size" type="range" min="2" max="24" step="1" value="5" aria-label="Pen thickness"><b class="sizeValue" id="sizeValue">5</b></label>
<button class="btn" id="undoBtn" type="button" disabled>↶ Undo</button>
<button class="btn soft" id="gridBtn" type="button" aria-pressed="true">▦ Grid</button>
<button class="btn" id="fullBtn" type="button">⛶ Full screen</button>
<button class="btn danger" id="clearBtn" type="button">Clear</button>
</div>
</header>
<main class="boardWrap grid" id="boardWrap" data-watermark="Smart Math Beta"><canvas id="board" aria-label="Interactive whiteboard"></canvas><div class="mode" id="modeBadge">Pen · navy · 5 px</div></main>
</div>
<div class="toast" id="toast"></div>
<script src="whiteboard-core.js?v=20261011-0534-core1"></script>
<script src="whiteboard-text-drag.js?v=20261011-0534-wordbox1"></script>
<script src="whiteboard-right-click-paste.js?v=20261011-rcpaste-2215"></script>
<script src="whiteboard-classroom-pro.js?v=67565ce9d90f"></script>
<script src="whiteboard-extra-shapes.js?v=20261011-0650-square-triangle1"></script>
<script src="whiteboard-escape-select.js?v=20261011-0645-esc-select1"></script>
<script src="whiteboard-rotate.js?v=20261011-rotate-0712-a1"></script>
<script src="smart-math-recognition.js?v=20261011-smartmath-beta1"></script>
<script src="smart-math-counters-v2.js?v=20261011-0751-counterlarge4"></script>
<script src="smart-math-fractions-v2.js?v=20261011-0820-fractioncolour3"></script>
<script src="smart-math-fraction-height.js?v=20261011-0825-fractionheight1"></script>
<script src="whiteboard-marquee-select.js?v=20261011-0842-marqueedelete2"></script>
<script src="smart-math-bars-v2.js?v=20261011-0900-barsplit4"></script>
</body>
</html>
